name: Container reproducibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Derive the image timestamp from the source commit
        id: source
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: First clean build
        id: first
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          outputs: type=oci,dest=${{ runner.temp }}/first.tar,rewrite-timestamp=true,oci-mediatypes=false
      - name: Second clean build
        id: second
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          outputs: type=oci,dest=${{ runner.temp }}/second.tar,rewrite-timestamp=true,oci-mediatypes=false
      - name: Verify and record the identical content digest
        env:
          FIRST: ${{ steps.first.outputs.digest }}
          SECOND: ${{ steps.second.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$FIRST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$FIRST" = "$SECOND"
          printf 'Source commit: %s\n\nTwo clean builds: %s\n' "$SOURCE_SHA" "$FIRST" >> "$GITHUB_STEP_SUMMARY"
