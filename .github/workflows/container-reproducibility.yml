name: Container reproducibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit:v0.25.1@sha256:79cc6476ab1a3371c9afd8b44e7c55610057c43e18d9b39b68e2b0c2475cc1b6
      - name: Derive the image timestamp from the source commit
        id: source
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: First clean build
        id: first
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          outputs: type=oci,dest=${{ runner.temp }}/first.tar,rewrite-timestamp=true,oci-mediatypes=false
      - name: Second clean build
        id: second
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          outputs: type=oci,dest=${{ runner.temp }}/second.tar,rewrite-timestamp=true,oci-mediatypes=false
      - name: Verify and record the identical content digest
        env:
          FIRST: ${{ steps.first.outputs.digest }}
          SECOND: ${{ steps.second.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$FIRST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$FIRST" = "$SECOND"
          printf 'Source commit: `%s`\n\nTwo clean builds: `%s`\n' "$SOURCE_SHA" "$FIRST" >> "$GITHUB_STEP_SUMMARY"
