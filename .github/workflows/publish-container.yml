name: Publish container

# Every commit on main has already passed the required `check` and `pr-title`
# gates through branch protection, so this workflow builds the merge result
# directly. The image promotion proof in personal-infra binds this workflow by
# path and id and requires a push-event run, so the trigger must stay `push`.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: publish-container-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout the commit being published
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the tracked tag
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          # Plain manifest, not an attestation index: prod-1 pins and pulls the
          # digest this step reports, and podman resolves it directly.
          provenance: false
          tags: ghcr.io/davidvornholt/punktlandung:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Emit immutable promotion record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/davidvornholt/punktlandung
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          record=$(jq -cn --arg repository "$REPOSITORY" --arg ref "$REF" --arg sha "$SHA" --arg runId "$RUN_ID" --arg image "$IMAGE" --arg digest "$DIGEST" '{repository:$repository,ref:$ref,sha:$sha,runId:$runId,image:$image,digest:$digest}')
          marker_left=IMAGE_PROMOTION
          marker_right=_RECORD
          printf '%s %s\n' "${marker_left}${marker_right}" "$record"

  announce:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the canonical SOPS action
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the broker app id
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.app_id
          env-name: BROKER_APP_ID

      - name: Resolve the broker private key
        uses: ./.github/actions/sops-secret
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secret-file: secrets/ci.yaml
          secret-key: broker_app.private_key
          env-name: BROKER_APP_PRIVATE_KEY

      - name: Mint an infrastructure announcement token
        id: broker
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.BROKER_APP_ID }}
          private-key: ${{ env.BROKER_APP_PRIVATE_KEY }}
          owner: davidvornholt
          repositories: personal-infra
          permission-contents: write

      - name: Announce image digest
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ steps.broker.outputs.token }}
          IMAGE_REPOSITORY: ghcr.io/davidvornholt/punktlandung
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$SOURCE_REPOSITORY" = davidvornholt/punktlandung
          test "$SOURCE_REF" = refs/heads/main
          test "$IMAGE_REPOSITORY" = ghcr.io/davidvornholt/punktlandung
          gh api repos/davidvornholt/personal-infra/dispatches \
            -f event_type=image-bump \
            -f "client_payload[app]=punktlandung" \
            -f "client_payload[source_repository]=$SOURCE_REPOSITORY" \
            -f "client_payload[source_ref]=$SOURCE_REF" \
            -f "client_payload[source_sha]=$SOURCE_SHA" \
            -f "client_payload[source_run_id]=$SOURCE_RUN_ID" \
            -f "client_payload[image_repository]=$IMAGE_REPOSITORY" \
            -f "client_payload[digest]=$BUILD_DIGEST"
