name: Check preview environment credential presence

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.repository == 'davidvornholt/punktlandung' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: pr-preview
    steps:
      - name: Assert the dedicated environment credential exists
        env:
          PREVIEW_CREDENTIAL: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIEW_CREDENTIAL" ]; then
            echo 'Dedicated preview environment credential is present.'
          else
            echo '::error::Dedicated preview environment credential is empty.'
            exit 1
          fi
